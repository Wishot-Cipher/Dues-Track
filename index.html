<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon - Payvexo Logo -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/app-icon.png" />
    <link rel="shortcut icon" href="/app-icon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Payvexo - Smart Payment & Dues Management Platform</title>
    <meta name="title" content="Payvexo - Smart Payment & Dues Management Platform" />
    <meta name="description" content="The all-in-one payment tracking and dues management platform for universities, churches, clubs, and organizations. Collect dues, track expenses, and manage finances securely." />
    <meta name="keywords" content="payvexo, payment management, dues tracker, church dues, university fees, organization payments, club dues, SaaS, multi-tenant" />
    <meta name="author" content="Payvexo" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="theme-color" content="#6C3AED" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://payvexo.vercel.app/" />
    <meta property="og:title" content="Payvexo - Smart Payment & Dues Management" />
    <meta property="og:description" content="The all-in-one platform for collecting dues, tracking payments, and managing finances for universities, churches, clubs, and organizations." />
    <meta property="og:image" content="/icon-512.svg" />
    <meta property="og:site_name" content="Payvexo" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://payvexo.vercel.app/" />
    <meta property="twitter:title" content="Payvexo - Smart Payment & Dues Management" />
    <meta property="twitter:description" content="Collect dues, track payments, and manage finances for any organization. Universities, churches, clubs, and more." />
    <meta property="twitter:image" content="/icon-512.svg" />
    
    <!-- PWA & Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Payvexo" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.svg" />
    
    <!-- Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <!-- Prevent white flash - set background immediately -->
    <style>
      html, body, #root {
        background-color: #0A0118 !important;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body style="background-color: #0A0118;">
    <div id="root" style="background-color: #0A0118; min-height: 100vh; min-height: 100dvh;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
