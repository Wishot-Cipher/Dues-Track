<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <!--
    Payvexo Full Logo — Icon + Wordmark
    For login pages, splash screens, marketing
  -->
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB4F"/>
      <stop offset="45%" stop-color="#FF6803"/>
      <stop offset="100%" stop-color="#C83E00"/>
    </linearGradient>
    <radialGradient id="bloomF" cx="36%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#FFD6A6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF6803" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mintF" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30FFAC"/>
      <stop offset="100%" stop-color="#1BD88A"/>
    </linearGradient>
    <linearGradient id="barF" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <filter id="liftF" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7A2E00" flood-opacity="0.18"/>
    </filter>
    <filter id="mintGF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipF">
      <rect x="12" y="12" width="216" height="216" rx="50"/>
    </clipPath>
  </defs>

  <!-- ========================= -->
  <!--   ICON (left side)         -->
  <!-- ========================= -->
  <g>
    <!-- Background -->
    <rect x="12" y="12" width="216" height="216" rx="50" fill="url(#bgF)"/>
    <rect x="12" y="12" width="216" height="216" rx="50" fill="url(#bloomF)"/>
    <g clip-path="url(#clipF)">
      <ellipse cx="90" cy="8" rx="140" ry="80" fill="white" opacity="0.06"/>
    </g>

    <!-- Mark (scaled to fit 240×240 space) -->
    <g filter="url(#liftF)" transform="translate(12, 12) scale(0.4667)">
      <!-- Orbital arc -->
      <path d="M 136,352 A 148,148 0 1,1 392,218" 
            fill="none" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.13"/>
      <!-- Baseline -->
      <line x1="140" y1="378" x2="372" y2="378" 
            stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
      <!-- Bars -->
      <rect x="156" y="298" width="56" height="80" rx="14" fill="url(#barF)"/>
      <rect x="228" y="252" width="56" height="126" rx="14" fill="url(#barF)"/>
      <rect x="300" y="174" width="56" height="204" rx="14" fill="url(#barF)"/>
      <!-- Connector -->
      <polyline points="184,296 256,250 328,172" 
                fill="none" stroke="white" stroke-width="4.5" 
                stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
      <!-- Nodes -->
      <circle cx="184" cy="296" r="5.5" fill="white" opacity="0.55"/>
      <circle cx="256" cy="250" r="5.5" fill="white" opacity="0.55"/>
      <!-- Verified peak -->
      <g filter="url(#mintGF)">
        <circle cx="328" cy="172" r="16" fill="none" stroke="url(#mintF)" stroke-width="3.5" opacity="0.82"/>
        <circle cx="328" cy="172" r="6" fill="url(#mintF)"/>
      </g>
      <!-- Arrow tip -->
      <path d="M 322,146 L 328,132 L 334,146" 
            fill="none" stroke="white" stroke-width="3" 
            stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    </g>
  </g>

  <!-- ========================= -->
  <!--   WORDMARK (right side)    -->
  <!-- ========================= -->
  <g transform="translate(262, 0)">
    <!-- App name -->
    <text x="0" y="128" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" 
          font-weight="800" font-size="72" letter-spacing="-1" fill="#FFFFFF">
      Dues<tspan fill="#FF6803">Tracker</tspan>
    </text>

    <!-- Tagline -->
    <text x="3" y="168" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" 
          font-weight="500" font-size="20" letter-spacing="4.5" fill="#B8B8B8">
      PAYMENT MANAGEMENT
    </text>

    <!-- Accent bar under tagline -->
    <rect x="3" y="180" width="120" height="3" rx="1.5" fill="#FF6803" opacity="0.5"/>
    <rect x="3" y="180" width="48" height="3" rx="1.5" fill="#30FFAC" opacity="0.7"/>
  </g>
</svg>
