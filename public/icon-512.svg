<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Primary Gradient - Warm Orange -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8534;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6803;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC5202;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient - Mint -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16F456;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30FFAC;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background Gradient - Dark Brown -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0E09;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0703;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6803" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.2"/>
  
  <!-- Main Card Shape - Representing Payment/Dues -->
  <rect x="96" y="138" width="320" height="236" rx="42" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Card Detail -->
  <rect x="118" y="160" width="276" height="192" rx="32" fill="url(#bgGrad)" opacity="0.85"/>
  
  <!-- DT Monogram - Professional Style -->
  <!-- "D" letter -->
  <path d="M160 218 L160 304 L202 304 C234 304 256 282 256 261 C256 240 234 218 202 218 L160 218 Z" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "T" letter -->
  <path d="M288 218 L352 218 M320 218 L320 304" 
        fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative Corner Elements -->
  <circle cx="138" cy="180" r="8" fill="url(#accentGrad)" opacity="0.8"/>
  <circle cx="374" cy="180" r="8" fill="url(#accentGrad)" opacity="0.8"/>
  <circle cx="138" cy="332" r="8" fill="url(#accentGrad)" opacity="0.5"/>
  <circle cx="374" cy="332" r="8" fill="url(#accentGrad)" opacity="0.5"/>
  
  <!-- Accent Line - Bottom Detail -->
  <rect x="150" y="346" width="212" height="10" rx="5" fill="url(#accentGrad)" opacity="0.6"/>
  
  <!-- Top Decorative Lines -->
  <rect x="186" y="112" width="140" height="8" rx="4" fill="url(#primaryGrad)" opacity="0.4"/>
  
  <!-- Signal/Pulse Lines - Representing Tracking -->
  <path d="M426 192 Q448 212 426 234" fill="none" stroke="url(#primaryGrad)" stroke-width="5" opacity="0.5"/>
  <path d="M442 176 Q474 212 442 248" fill="none" stroke="url(#primaryGrad)" stroke-width="5" opacity="0.3"/>
  <path d="M458 160 Q500 212 458 264" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.15"/>
  
  <!-- Left Signal Lines -->
  <path d="M86 192 Q64 212 86 234" fill="none" stroke="url(#accentGrad)" stroke-width="5" opacity="0.5"/>
  <path d="M70 176 Q38 212 70 248" fill="none" stroke="url(#accentGrad)" stroke-width="5" opacity="0.3"/>
  <path d="M54 160 Q12 212 54 264" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.15"/>
  
  <!-- Bottom Reflection Line -->
  <ellipse cx="256" cy="420" rx="120" ry="8" fill="url(#primaryGrad)" opacity="0.1"/>
</svg>
