<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Payvexo Favicon — Minimal bar chart mark
    Matches the full logo identity: ascending bars + verified node
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB4F"/>
      <stop offset="45%" stop-color="#FF6803"/>
      <stop offset="100%" stop-color="#C83E00"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30FFAC"/>
      <stop offset="100%" stop-color="#1BD88A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Three ascending bars (golden ratio heights) -->
  <rect x="5" y="18" width="6" height="9" rx="1.8" fill="white" opacity="0.92"/>
  <rect x="13" y="13" width="6" height="14" rx="1.8" fill="white" opacity="0.92"/>
  <rect x="21" y="7" width="6" height="20" rx="1.8" fill="white" opacity="0.92"/>

  <!-- Verified peak node -->
  <circle cx="24" cy="5.5" r="2.8" fill="url(#mint)"/>
</svg>
