<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <!-- Primary Gradient - Warm Orange -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8534;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6803;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC5202;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient - Mint -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16F456;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30FFAC;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background Gradient - Dark Brown -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0E09;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0703;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Glow -->
  <circle cx="96" cy="96" r="88" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="96" cy="96" r="82" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Main Card Shape - Representing Payment/Dues -->
  <rect x="36" y="52" width="120" height="88" rx="16" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Inner Card Detail -->
  <rect x="44" y="60" width="104" height="72" rx="12" fill="url(#bgGrad)" opacity="0.85"/>
  
  <!-- DT Monogram - Professional Style -->
  <!-- "D" letter -->
  <path d="M60 82 L60 114 L76 114 C88 114 96 106 96 98 C96 90 88 82 76 82 L60 82 Z" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "T" letter -->
  <path d="M108 82 L132 82 M120 82 L120 114" 
        fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative Corner Elements -->
  <circle cx="52" cy="68" r="3" fill="url(#accentGrad)" opacity="0.8"/>
  <circle cx="140" cy="68" r="3" fill="url(#accentGrad)" opacity="0.8"/>
  <circle cx="52" cy="124" r="3" fill="url(#accentGrad)" opacity="0.5"/>
  <circle cx="140" cy="124" r="3" fill="url(#accentGrad)" opacity="0.5"/>
  
  <!-- Accent Line - Bottom Detail -->
  <rect x="56" y="130" width="80" height="4" rx="2" fill="url(#accentGrad)" opacity="0.6"/>
  
  <!-- Top Decorative Lines -->
  <rect x="70" y="42" width="52" height="3" rx="1.5" fill="url(#primaryGrad)" opacity="0.4"/>
  
  <!-- Signal/Pulse Lines - Representing Tracking -->
  <path d="M160 72 Q168 80 160 88" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M166 68 Q178 80 166 92" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Left Signal Lines -->
  <path d="M32 72 Q24 80 32 88" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M26 68 Q14 80 26 92" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>
</svg>
